[package]
name = "ortak-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ortak run dispatch and supervision foundation: authoritative run_dispatch consumption, idempotent runtime starts, cursor-resumed event ingestion, and supervised cancellation over the RuntimeAdapter port"

[features]
# Isolated repositories only; no worker, normalizer or public route is enabled.
encrypted-dm = ["ortak-office/encrypted-dm"]

[dependencies]
base64.workspace = true
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "=0.13.0"
getrandom = "=0.4.3"
zeroize.workspace = true
ortak-control.workspace = true
ortak-domain.workspace = true
ortak-office.workspace = true
chrono.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
url.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

tokio.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
nostr.workspace = true
buzz-db.workspace = true
serde_yaml.workspace = true
