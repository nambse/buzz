encrypted-dm = ["ortak-runtime/encrypted-dm"]

[dependencies]
axum.workspace = true
base64.workspace = true
buzz-auth.workspace = true
buzz-pubsub.workspace = true
chrono.workspace = true
deadpool-redis.workspace = true
futures-util.workspace = true
hex.workspace = true
nostr.workspace = true
ortak-control.workspace = true
ortak-domain.workspace = true
ortak-memory.workspace = true
ortak-router.workspace = true
ortak-routing-semantic.workspace = true
ortak-observability.workspace = true
ortak-office.workspace = true
ortak-runtime.workspace = true
ortak-work.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix = { version = "1.1.4", features = ["fs", "process"] }
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
buzz-db.workspace = true

serde_yaml.workspace = true
